project:
  name: "demand-forecast"
  seed: 42
  version: "0.4.4"

paths:
  data_raw: "data/raw/"
  data_processed: "data/processed/features.parquet"
  data_predictions: "data/predictions/"
  models: "models/"

data:
  target: "sales"
  date_col: "date"
  n_stores: 54
  n_families: 33
  n_series: 1782
  date_start: "2013-01-01"
  date_end: "2017-08-15"
  group_cols:
    - "store_nbr"
    - "family"
  categorical_cols:
    - "city"
    - "state"
    - "type"
    - "cluster"
    - "family"
    - "locale"
  family_segments:
    high_frequency_treshold: 0.30
    low_frequency_treshold: 0.50

model:
  horizon_diario: 7
  horizon_mensual: 30
  top_families: [3, 7, 12, 30]
  params_lgbm_diario:
    n_estimators: 1500
    learning_rate: 0.05
    objective: "regression_l1"
    metric: "mae"
    num_leaves: 63
    max_bin: 255
    min_data_in_leaf: 20
    lambda_l1: 0.1
    lambda_l2: 0.2
    random_state: 42
    n_jobs: -1
    verbosity: -1
  params_lgbm_mensual:
    n_estimators: 1000
    learning_rate: 0.01
    objective: "huber"
    metric: "mae"
    num_leaves: 31
    max_bin: 255
    min_data_in_leaf: 100
    lambda_l1: 0.5
    lambda_l2: 0.1
    random_state: 42
    n_jobs: -1
    verbosity: -1

features:
  holiday_impact:
    positive:
      - "Navidad"
      - "Dia de la Madre"
      - "Carnaval"
      - "Dia del Trabajo"
      - "Independencia de Cuenca"
      - "Fundacion de Quito"
      - "Mundial"
      - "Dia de Difuntos"
    negative:
      - "Primer dia del ano"
      - "Traslado"
      - "Black Friday"
      - "Cyber Monday"
      - "Puente"
      - "Recupero"
    atypical:
      - "Terremoto"
    
lags:
  max_lag: 365
  max_rolling: 90

training:
  test_size_weeks: 8
  n_folds: 5
  weight_value: 5

optuna:
  n_trials: 150
  timeout_seconds: 28800
  n_folds: 4
  subsample_ratio: 0.30
  max_boost_round: 600
  early_stopping_rounds: 80
  direction: "minimize"
  metric: "mae"
  storage: null
  pruner: "hyperband"

mlflow:
  experiment_name: "demand-forecast"
  tracking_uri: "https://dagshub.com/jorgesandovalpablo/demand-forecast.mlflow"
